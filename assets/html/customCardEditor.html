<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character card V2 editor</title>
    <style>
        input, textarea {
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
        }

        div.card-grid {
            display: grid; 
            grid-auto-rows: auto; 
            grid-template-columns: max-content 1fr; 
            gap: 1em;
            align-items: baseline;
        }

        div.card-grid textarea {
            padding: 0.32em;
            border-style: inset;
            resize: vertical;
        }

        div.card-grid input {
            padding: 0.32em;
            border-style: inset;
        }
    </style>
</head>

<body>

    <div class="card-grid">
        <label for="data.name">Name:</label>
        <textarea id="data.name" data-binding="data.name"></textarea>

        <label for="data.description">Description</label>
        <textarea id="data.description" data-binding="data.description"></textarea>

        <label for="data.scenario">Scenario</label>
        <textarea id="data.scenario" data-binding="data.scenario"></textarea>

        <label for="data.first_mes">First message</label>
        <textarea id="data.first_mes" data-binding="data.first_mes"></textarea>

        <label for="data.mes_example">Mes example</label>
        <textarea id="data.mes_example" data-binding="data.mes_example"></textarea>

        <label for="data.creator_notes">Creator notes</label>
        <textarea id="data.creator_notes" data-binding="data.creator_notes"></textarea>

        <label for="data.system_prompt">System prompt</label>
        <textarea id="data.system_prompt" data-binding="data.system_prompt"></textarea>

        <label for="data.post_history_instructions">Post history instructions</label>
        <textarea id="data.post_history_instructions" data-binding="data.post_history_instructions"></textarea>

    </div>

    <script>
        const vscode = acquireVsCodeApi();

        // Updates a single binding
        const updateBinding = function(
            bindingName,
            newValue
        ) {
            // Find by named data-binding
            var bindingElement = document.querySelector(`[data-binding = '${bindingName}']`);

            // Assign where possible
            if (bindingElement instanceof HTMLTextAreaElement) {
                bindingElement.value = newValue;
                resizeTextarea(bindingElement);
            } else {
                console.warn(`Unable to bind to an element of type ${typeof bindingElement}`);
            }
        }

        // Updates all the bindings
        const updateBindings = function(card) {
            updateBinding("data.name", card.data.name);
            updateBinding("data.description", card.data.description);
            updateBinding("data.scenario", card.data.scenario);
            updateBinding("data.first_mes", card.data.first_mes);
            updateBinding("data.mes_example", card.data.mes_example);
            updateBinding("data.creator_notes", card.data.creator_notes);
            updateBinding("data.system_prompt", card.data.system_prompt);
            updateBinding("data.post_history_instructions", card.data.post_history_instructions);
        }

        // Updates the view based on the received card from the vscode extension
        const updateView = function(card) {
            updateBindings(card);

            // Set the latest state
            vscode.setState(card);
        }

        // Handles the resizing of a textare to match it's content size
        const resizeTextarea = function(element) {
            if (element.scrollHeight != element.clientHeight) {
                element.style.height = `${element.scrollHeight}px`;
            }
        }

        const bindingElements = document.querySelectorAll("[data-binding]");
        bindingElements.forEach(elem => {
            elem.addEventListener("input", () => {
                resizeTextarea(elem);
            })
        })

        // Handle messages from the extension
        window.addEventListener(
            "message", 
            (event) => {
                // Use type from extension
                let type = event.data.type;
                switch (type) {
                    case "update":
                        updateView(event.data.card);
                        break;
                    default:
                        console.warn(`Unknown type: ${type} received`);
                        break;
                }
            }
        )

        // Check previous states
        let previousState = vscode.getState();
        if (previousState) { // If not falsy; assume previous state was found
            updateView(previousState);
        }

    </script>

</body>

</html>
