<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character card V2 editor</title>
</head>

<body>

    <div>
        <label for="name">Name:</label>
        <input id="name" data-binding="data.name" type="text" />
    </div>

    <div>
        <label for="card-data-description">Description</label>
        <textarea name="description" id="card-data-description" data-binding="data.description"></textarea>
    </div>

</body>

</html>
